name: Deploy Pages

# Production: whatever is on `main` becomes https://<owner>.github.io/<repo>/.
# Published into the root of the `gh-pages` branch; `keep_files` preserves the
# per-PR preview folders that `preview-pages.yml` writes below `pr-<number>/`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for the project sub-path
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          VITE_BUILD_LABEL: main
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_BUILD_AT: ${{ github.event.head_commit.timestamp }}
          VITE_REPO: ${{ github.repository }}
        run: npm run build

      - name: Publish to gh-pages (root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          keep_files: true
          commit_message: 'deploy: main @ ${{ github.sha }}'
