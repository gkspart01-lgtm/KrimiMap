<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">Crime City — shared detective map</title>
  <desc id="desc">An original illustrated city plan with a river, park, railway station, plaza, neighborhoods and street blocks.</desc>
  <defs>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 7h28M0 21h28" stroke="#d8cbb4" stroke-width="1" opacity=".32"/>
      <circle cx="6" cy="15" r="1" fill="#c9b99e" opacity=".3"/>
      <circle cx="22" cy="3" r="1" fill="#c9b99e" opacity=".24"/>
    </pattern>
    <pattern id="block" width="32" height="28" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="23" height="18" rx="2" fill="#c8b9a0" stroke="#b2a287" stroke-width="1"/>
      <path d="M7 7h15M7 11h15M7 15h9" stroke="#aa987d" stroke-width="1" opacity=".65"/>
    </pattern>
    <pattern id="smallBlocks" width="25" height="23" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="17" height="14" rx="2" fill="#d0c1a8" stroke="#b6a58b" stroke-width="1"/>
      <path d="M6 7h11M6 11h7" stroke="#ab987c" stroke-width="1" opacity=".65"/>
    </pattern>
    <pattern id="water" width="90" height="46" patternUnits="userSpaceOnUse">
      <path d="M-10 15c20-10 40-10 60 0s40 10 60 0M-10 37c20-10 40-10 60 0s40 10 60 0" fill="none" stroke="#8ebac2" stroke-width="3" opacity=".55"/>
    </pattern>
    <pattern id="park" width="65" height="60" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="20" r="10" fill="#9bb28a"/>
      <circle cx="22" cy="17" r="6" fill="#b3c69e"/>
      <path d="M18 27v8" stroke="#796f55" stroke-width="2"/>
      <circle cx="50" cy="45" r="8" fill="#8da982"/>
      <path d="M50 52v6" stroke="#796f55" stroke-width="2"/>
    </pattern>
    <clipPath id="cityClip"><rect x="30" y="30" width="2340" height="1540" rx="30"/></clipPath>
  </defs>

  <rect width="2400" height="1600" fill="#d7cbb7"/>
  <rect x="22" y="22" width="2356" height="1556" rx="34" fill="#f1e8d7" stroke="#8b7e68" stroke-width="5"/>
  <g clip-path="url(#cityClip)">
    <rect x="30" y="30" width="2340" height="1540" fill="#eee5d3"/>
    <rect x="30" y="30" width="2340" height="1540" fill="url(#paper)"/>

    <!-- Neighborhood blocks: distinct parcel grids around the main roads. -->
    <path d="M120 130H900V600H120zM1040 115H1660V520H1040zM1790 120H2250V600H1790zM120 790H570V1430H120zM830 980H1390V1435H830zM1500 840H2240V1420H1500z" fill="url(#block)" opacity=".94"/>
    <path d="M1110 590H1640V920H1110zM600 1050H780V1415H600zM1710 640H2220V800H1710z" fill="url(#smallBlocks)" opacity=".88"/>

    <!-- River and green belt define a recognizable, original city geography. -->
    <path d="M1970-60C1850 170 2020 305 1890 500S1770 780 1900 960 2020 1245 1860 1660H2260C2390 1350 2220 1110 2110 940S2030 690 2150 500 2290 220 2220-60Z" fill="#a9cbd0" stroke="#6b9ba5" stroke-width="8"/>
    <path d="M1970-60C1850 170 2020 305 1890 500S1770 780 1900 960 2020 1245 1860 1660H2260C2390 1350 2220 1110 2110 940S2030 690 2150 500 2290 220 2220-60Z" fill="url(#water)" opacity=".8"/>
    <path d="M220 600C470 500 700 550 910 670S1210 770 1500 650 1740 560 1900 650" fill="none" stroke="#b4c59c" stroke-width="190" opacity=".55"/>
    <path d="M260 600C500 515 700 575 910 690S1210 780 1500 670 1730 590 1880 670" fill="none" stroke="#91ad83" stroke-width="130"/>
    <path d="M260 600C500 515 700 575 910 690S1210 780 1500 670 1730 590 1880 670" fill="url(#park)" opacity=".8"/>
    <path d="M310 604C525 543 695 597 910 707S1210 802 1500 689 1700 622 1840 685" fill="none" stroke="#e5d7b8" stroke-width="8" stroke-dasharray="18 16"/>

    <!-- Broad avenues with pale paving and a dashed center line. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 740C500 720 780 760 1100 820S1640 840 1850 740" stroke="#b7a88e" stroke-width="90"/>
      <path d="M70 740C500 720 780 760 1100 820S1640 840 1850 740" stroke="#fbf4e7" stroke-width="74"/>
      <path d="M70 740C500 720 780 760 1100 820S1640 840 1850 740" stroke="#d5c7ad" stroke-width="3" stroke-dasharray="20 22"/>
      <path d="M980 70C930 350 1010 520 1000 690S1040 1060 980 1530" stroke="#b7a88e" stroke-width="78"/>
      <path d="M980 70C930 350 1010 520 1000 690S1040 1060 980 1530" stroke="#fbf4e7" stroke-width="64"/>
      <path d="M980 70C930 350 1010 520 1000 690S1040 1060 980 1530" stroke="#d5c7ad" stroke-width="3" stroke-dasharray="18 20"/>
      <path d="M1510 80C1430 320 1500 525 1460 700S1450 1100 1505 1510" stroke="#b7a88e" stroke-width="66"/>
      <path d="M1510 80C1430 320 1500 525 1460 700S1450 1100 1505 1510" stroke="#fbf4e7" stroke-width="54"/>
      <path d="M1510 80C1430 320 1500 525 1460 700S1450 1100 1505 1510" stroke="#d5c7ad" stroke-width="3" stroke-dasharray="17 19"/>
    </g>

    <!-- Smaller streets and short connectors. -->
    <g fill="none" stroke="#f9f1e2" stroke-width="24" stroke-linecap="round">
      <path d="M120 290H900M130 440H900M160 540H880M1100 230H1640M1080 370H1650M1800 260H2280M1780 410H2250M250 900V1410M420 830V1450M560 850V1450M880 1010H1370M860 1170H1390M870 1320H1380M1580 970H1820M1580 1130H1825M1580 1290H1860"/>
      <path d="M250 140V570M430 130V565M610 140V575M790 135V575M1170 130V500M1320 125V510M1510 130V500M1850 145V590M2030 125V460M2190 120V440"/>
    </g>
    <g fill="none" stroke="#c8b99f" stroke-width="3" stroke-dasharray="10 12">
      <path d="M120 290H900M130 440H900M160 540H880M1100 230H1640M1080 370H1650M1800 260H2280M1780 410H2250M250 900V1410M420 830V1450M560 850V1450M880 1010H1370M860 1170H1390M870 1320H1380M1580 970H1820M1580 1130H1825M1580 1290H1860"/>
      <path d="M250 140V570M430 130V565M610 140V575M790 135V575M1170 130V500M1320 125V510M1510 130V500M1850 145V590M2030 125V460M2190 120V440"/>
    </g>

    <!-- Bridges cross the river; docks and boats make the waterfront legible. -->
    <g stroke="#806f57" stroke-width="8">
      <path d="M1850 355H2150"/><path d="M1820 825H2140"/><path d="M1900 1180H2180"/>
    </g>
    <g stroke="#f2e8d4" stroke-width="28">
      <path d="M1850 355H2150"/><path d="M1820 825H2140"/><path d="M1900 1180H2180"/>
    </g>
    <g fill="#e8d0a5" stroke="#887a61" stroke-width="4">
      <path d="M2180 300h120v60h-120zM2150 390h140v50h-140zM2170 470h110v55h-110zM2160 890h125v58h-125zM2160 980h130v55h-130zM2180 1080h110v60h-110z"/>
    </g>
    <g fill="#d9ece9" stroke="#6b8790" stroke-width="4">
      <path d="M1980 250l55 18-28 44-55-18zM2040 1060l60 8-16 48-60-8zM1990 1320l48 12-16 40-48-12z"/>
    </g>

    <!-- Landmark footprints. -->
    <g stroke="#8b5f50" stroke-width="5">
      <path d="M1130 610h180v125h-180z" fill="#d6b89b"/><path d="M1180 645h80v55h-80z" fill="#eadbc4"/>
      <path d="M720 1010h100v150H720z" fill="#b8c2a4"/><path d="M735 1030h70v80h-70z" fill="#e9e1cf"/>
      <path d="M1570 525h150v100h-150z" fill="#c8a9a1"/><path d="M1595 548h100v55h-100z" fill="#eadbc4"/>
      <path d="M370 980h120v140H370z" fill="#c6a67e"/><path d="M395 1005h70v90h-70z" fill="#efe2cb"/>
    </g>
    <g fill="#756650" font-family="system-ui,sans-serif" font-size="19" font-weight="700" letter-spacing="2">
      <text x="1150" y="602">CENTRAL STATION</text>
      <text x="680" y="1190">CITY GARDENS</text>
      <text x="1560" y="510">OLD TOWN HALL</text>
      <text x="330" y="1150">MARKET HALL</text>
    </g>

    <!-- District labels and map furniture. -->
    <g fill="#766b58" font-family="Georgia,serif" font-size="34" font-weight="700" letter-spacing="5" opacity=".74">
      <text x="180" y="190">NORDHÖHE · NORTH RIDGE</text>
      <text x="1120" y="180">ALTSTADT · OLD TOWN</text>
      <text x="1820" y="180">HAFEN · QUAYSIDE</text>
      <text x="220" y="890">WESTEND</text>
      <text x="880" y="1470">SÜDMARKT · SOUTH MARKET</text>
      <text x="1580" y="1460">WERKVIERTEL · WORKS</text>
    </g>
    <g fill="#736a5b" font-family="system-ui,sans-serif" font-size="17" letter-spacing="1.5" opacity=".82">
      <text x="150" y="330" transform="rotate(-90 150 330)">LINDENSTRASSE</text>
      <text x="845" y="480" transform="rotate(-90 845 480)">MUSEUMSALLEE</text>
      <text x="1080" y="775">RINGSTRASSE</text>
      <text x="1320" y="1020" transform="rotate(90 1320 1020)">BAHNHOFSTRASSE</text>
      <text x="1650" y="700">BRÜCKENWEG</text>
      <text x="420" y="700">PARKALLEE</text>
    </g>

    <g transform="translate(2260 1360)" fill="none" stroke="#5e5548" stroke-width="5">
      <path d="M0 80V0M-18 22L0 0l18 22"/><path d="M-24 80h48"/>
    </g>
    <text x="2260" y="1470" text-anchor="middle" fill="#5e5548" font-family="system-ui,sans-serif" font-size="19" font-weight="700">N</text>
    <text x="70" y="1510" fill="#756b5b" font-family="system-ui,sans-serif" font-size="18" letter-spacing="2">KRIMIMAP · CITY PLAN / EDITION 01</text>
    <text x="2300" y="1510" text-anchor="end" fill="#756b5b" font-family="system-ui,sans-serif" font-size="18" letter-spacing="2">SHARED CASE MAP</text>
  </g>
  <rect x="22" y="22" width="2356" height="1556" rx="34" fill="none" stroke="#8b7e68" stroke-width="5"/>
</svg>
